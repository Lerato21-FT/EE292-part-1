# Runs the same gate as a developer, `make verify`, on every pull request and on
# pushes to main. Turn on branch protection for main (Settings → Branches) and
# require this check, so main cannot move without a green run. Peer review round 6.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: make verify (lint, tests, API smoke, Chromium checks)
        run: make verify
      - name: Keep screenshots and exported PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: artifacts/
          if-no-files-found: ignore
