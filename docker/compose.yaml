services:
  app:
    image: fmr_visualizer:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    ports:
      - "127.0.0.1:${FMR_PORT:-8765}:8000"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      FMR_DATA_DIR: /data
      RUFF_CACHE_DIR: /tmp/.ruff_cache
      TMPDIR: /tmp
    read_only: true
    tmpfs:
      - /tmp
  browser:
    profiles: [browser]
    image: fmr_browser_checks:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: browser-checks
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      FMR_DATA_DIR: /data
      TMPDIR: /tmp
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../artifacts:/artifacts
    shm_size: 1gb
