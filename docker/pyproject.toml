[project]
name = "fmr-visualizer"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120,<1",
    "numpy>=2.3,<3",
    "python-multipart>=0.0.20,<1",
    "scipy>=1.16,<2",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]
browser = ["playwright==1.56.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["../src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
